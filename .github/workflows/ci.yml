name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy crosscat/ --ignore-missing-imports
        continue-on-error: true

      - name: Fast tests (CPU, excludes slow/GPU tests)
        run: uv run pytest -m "not slow" -x -q --timeout=120

      # Slow tests are GPU-only — run on Kaggle via notebooks/run_tests.ipynb
      # Do NOT run them here; they will timeout on CPU runners.
