name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy crosscat/ --ignore-missing-imports
        continue-on-error: true

      # All tests (fast + slow) require JAX JIT compilation which is
      # too slow for CPU runners. Run tests on Kaggle P100 GPU via
      # notebooks/run_tests.ipynb instead.
