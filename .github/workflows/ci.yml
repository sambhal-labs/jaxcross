name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev,coverage]"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy crosscat/ --ignore-missing-imports
        continue-on-error: true

      - name: Test with coverage
        run: pytest -m "not slow" --cov=crosscat --cov-report=term-missing --cov-fail-under=60

  slow-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run slow tests
        run: pytest -m slow --timeout=600
