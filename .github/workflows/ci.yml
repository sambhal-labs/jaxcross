name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly full-suite run (Mondays 06:00 UTC). Per-push CI runs only the
  # narrow `-m cpu` slice to preserve free-tier minutes; the weekly run
  # catches regressions in the broader "not slow" suite.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy crosscat/ --ignore-missing-imports

      # GPU-heavy tests (packed kernels, full sweeps) require a GPU runner.
      # Run the full suite on Kaggle P100 via notebooks/run_tests.ipynb.
      # CPU-safe tests run below in the test-cpu job.

  test-cpu:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORM_NAME: cpu
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev --extra coverage

      - name: Run CPU-safe tests with coverage
        run: >-
          uv run pytest -m cpu --timeout=120 -x -v
          --cov=crosscat --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # Full "not slow" suite. Runs only on scheduled/manual triggers to preserve
  # free-tier minutes — per-push CI above stays on the narrow `-m cpu` slice.
  test-cpu-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORM_NAME: cpu
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run full "not slow" test suite
        run: uv run pytest -m "not slow" --timeout=300 -v
