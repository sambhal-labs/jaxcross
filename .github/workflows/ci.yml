name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy crosscat/ --ignore-missing-imports

      # GPU-heavy / multi-sweep tests are marked @pytest.mark.slow and run on
      # Kaggle (P100 / 2xT4) via notebooks/run_tests.ipynb. Everything else
      # runs on CPU in the test-cpu job below — the "not slow" selector gives
      # real coverage instead of the previous narrow "cpu"-marker filter.

  test-cpu:
    runs-on: ubuntu-latest
    env:
      JAX_PLATFORM_NAME: cpu
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run CPU-safe tests
        run: uv run pytest -m "not slow" --timeout=300 -x -v
