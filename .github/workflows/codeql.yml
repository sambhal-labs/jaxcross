name: "CodeQL"

# Requires "Code scanning" to be enabled in repository settings:
# Settings > Code security > Code scanning > Set up > Default
# On GitHub Free, this requires the repository to be public.

on:
  schedule:
    - cron: "0 6 * * 1"  # Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
