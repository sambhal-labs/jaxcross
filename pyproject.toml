[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jax-crosscat"
version = "0.2.0"
description = "GPU-accelerated nonparametric cross-categorization in JAX"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "jax-crosscat contributors" }]
keywords = ["bayesian", "crosscat", "dirichlet-process", "jax", "gpu", "gibbs-sampling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.4",
    "jaxlib>=0.4",
    "numpyro>=0.15",
    "blackjax>=1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "ruff>=0.5",
    "mypy>=1.10",
]
coverage = [
    "pytest-cov>=5",
]

[project.urls]
Homepage = "https://github.com/sambhal-labs/jaxcross"
Repository = "https://github.com/sambhal-labs/jaxcross"
Issues = "https://github.com/sambhal-labs/jaxcross/issues"

[tool.hatch.build.targets.wheel]
packages = ["crosscat"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B028"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
