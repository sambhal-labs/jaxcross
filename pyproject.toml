[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jax-crosscat"
version = "0.10.1"
description = "GPU-accelerated nonparametric cross-categorization in JAX"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "jax-crosscat contributors" }]
keywords = ["bayesian", "crosscat", "dirichlet-process", "jax", "gpu", "gibbs-sampling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Operating System :: OS Independent",
]
dependencies = [
    "jax>=0.4,<1.0",
    "jaxlib>=0.4,<1.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-timeout>=2",
    "hypothesis>=6.0",
    "scipy>=1.11",
    "ruff>=0.5",
    "mypy>=1.10",
]
coverage = [
    "pytest-cov>=5",
]
gpu = [
    "jax[cuda13]>=0.4",
]
dashboard = [
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=2.0",
]
benchmark = [
    "matplotlib>=3.8",
    "scikit-learn>=1.3",
    "wbgapi>=1.0",
    "pandas>=2.0",
    "seaborn>=0.13",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mike>=2.0",
]

[project.urls]
Homepage = "https://github.com/sambhal-labs/jaxcross"
Repository = "https://github.com/sambhal-labs/jaxcross"
Issues = "https://github.com/sambhal-labs/jaxcross/issues"
Documentation = "https://sambhal-labs.github.io/jaxcross/"
Changelog = "https://github.com/sambhal-labs/jaxcross/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["crosscat"]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B028"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.ipynb" = ["E402", "E501", "SIM108"]
"benchmarks/*.ipynb" = ["E402", "E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
